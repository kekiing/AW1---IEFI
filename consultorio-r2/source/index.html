<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultorio R2</title>
    <link rel="stylesheet" href="./css/index.css">
    <script type="module" src="./js/login.js"></script>
</head>
<body>

    <header class="cabecera-principal">
        <a class="enlace-inicio" href="./index.html">
            <img class="logotipo" src="./img/diente.svg" alt="logotipo clinica">
        </a>
    </header>

    <main class="contenido-principal">
        <h1>BIENVENIDO PACIENTE!</h1>

        <h2>Ingresa tus datos para continuar</h2>

        <form class="formulario-datos" method="post">
            <label for="id-correo">Correo electronico</label>
            <input type="email" name="correo" id="id-correo"
                required maxlength="100" autocomplete="email">

            <label for="id-password">Contraseña</label>
            <input type="password" name="password" id="id-password"
                required autocomplete="current-password">

            <p class="mensaje-estado" id="mensaje-login" role="alert"></p>

            <button type="submit">CONTINUAR</button>
        </form>

        <a class="enlace-auxiliar" href="./recuperarCuenta.html">Olvide mis datos</a>

        <a class="enlace-auxiliar" href="./registrarme.html">No tenes cuenta? Registrate aca</a>
    </main>

    <footer class="pie-principal">
        <ul class="redes-sociales">
            <li>
                <a href="https://instagram.com/@consultorioR2" target="_blank">
                    @consultorioR2
                </a>
            </li>
        </ul>
    </footer>

</body>
</html>
