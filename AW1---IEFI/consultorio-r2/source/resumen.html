<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>consultorio R2</title>
    <link rel="stylesheet" href="./css/index.css">
    <script type="module" src="./js/proteger.js"></script>
    <script type="module" src="./js/resumen.js"></script>
</head>
<body>

    <header class="cabecera-principal">
        <nav class="menu-principal">
            <a class="enlace-inicio" href="./index.html">
                <img class="logotipo" src="./img/diente.svg" alt="logotipo clinica">
            </a>
            <a href="./notificaciones.html">
                <img class="icono" src="./img/correo.svg" alt="correo notificaciones">

            <a href="./configuraciones.html">
                <img class="icono" src="./img/engranaje.svg" alt="menu lateral configuraciones">
            </a>
        </nav>
    </header>

    <main class="contenido-principal">
        <h1>Resumen del turno</h1>
        <dl class="resumen-turno">
            <dt>Paciente</dt>
            <dd id="resumen-paciente"></dd>

            <dt>Telefono</dt>
            <dd id="resumen-telefono"></dd>

            <dt>Correo electronico</dt>
            <dd id="resumen-correo"></dd>

            <dt>Tratamiento</dt>
            <dd id="resumen-tratamiento"></dd>

            <dt>Profesional</dt>
            <dd id="resumen-profesional"></dd>

            <dt>Fecha</dt>
            <dd id="resumen-horario"></dd>
        </dl>

        <p class="mensaje-estado" id="mensaje-confirmacion" role="alert"></p>

        <button type="button" id="boton-confirmar">CONFIRMAR TURNO</button>

    </main>

    <footer class="pie-principal">
        <h2>Dónde estamos</h2>
        <iframe class="mapa-ubicacion" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3404.692518418041!2d-64.18680482373392!3d-31.422596696552837!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9432a2855d648fa1%3A0xc450c66c8b10b5d3!2sRondeau%20175%2C%20X5000AVC%20C%C3%B3rdoba!5e0!3m2!1ses-419!2sar!4v1788387768851!5m2!1ses-419!2sar" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <ul class="redes-sociales">
            <li>
                <a href="https://instagram.com/@consultorioR2" target="_blank">
                    @consultorioR2
                </a>
            </li>
        </ul>
